name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.70"

      - uses: Swatinem/rust-cache@v2

      - name: Run unit and integration tests
        run: cargo test --verbose

      - name: Run streaming_cache example
        run: cargo run --example streaming_cache --release --verbose

      - name: Run decode_attention example
        run: cargo run --example decode_attention --release --verbose

      - name: Run agent_memory_budget example
        run: cargo run --example agent_memory_budget --release --verbose

      - name: Run mixed_precision example
        run: cargo run --example mixed_precision --release --verbose

      - name: Run config_ablation example
        run: cargo run --example config_ablation --release --verbose

      - name: Run forget_audit example
        run: cargo run --example forget_audit --release --verbose

      - name: Run passkey_retrieval example
        run: cargo run --example passkey_retrieval --release --verbose

      - name: Run shared_prefix example
        run: cargo run --example shared_prefix --release --verbose

      - name: Run context economics CLI
        run: cargo run --release --bin kivi-cache -- econ --model llama3-8b --agents 16 --ctx 128k --bits 2

      - name: List KV strategy comparison
        run: cargo run --release --bin kivi-cache -- strategies --verbose
