[package]
name = "kivi-cache"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
description = "Tuning-free asymmetric 2-bit KV-cache quantization (KIVI, ICML 2024)"
authors = ["Marcin Bielak <marcin.bieli+github+kivi+cache@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["quantization", "kv-cache", "llm", "attention", "kivi"]
categories = ["algorithms", "science"]
exclude = ["target"]

[[bin]]
name = "kivi-cache"
path = "src/bin/kivi-cache.rs"

[dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
